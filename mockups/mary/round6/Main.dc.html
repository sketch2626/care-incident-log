<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mary round 6: watch it</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="r6.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&amp;family=Fredoka:wght@600&amp;family=Nunito:wght@900&amp;display=swap">
<style>body{margin:0}</style>

<div class="scr {{who}}">
<div class="edge"></div>
<sc-if value="{{isMary}}" hint-placeholder-val="{{true}}">
<svg class="facesvg" viewBox="0 0 640 400" role="img" aria-label="Mary, talking">

<g transform="translate(0 -30)"><g class="sway"><g class="hop"><g class="face">
<g fill="none" stroke="#6b4a32" stroke-width="5" stroke-linecap="round"><path d="M228 140 C232 118 266 110 284 124"></path><path d="M412 140 C408 118 374 110 356 124"></path></g>
<ellipse class="cheek" cx="246" cy="234" rx="36" ry="15" fill="url(#bl)"></ellipse><ellipse class="cheek" cx="394" cy="234" rx="36" ry="15" fill="url(#bl)"></ellipse>
<g class="peek">
<g class="eye ss"><ellipse cx="256" cy="182" rx="25" ry="33" fill="#3a2b22"></ellipse><circle cx="264" cy="170" r="8" fill="#ffffff"></circle><path class="spark" d="M248 187 Q249 192 254 193 Q249 194 248 199 Q247 194 242 193 Q247 192 248 187 Z" fill="#ffffff"></path></g>
<g class="eye ss"><ellipse cx="384" cy="182" rx="25" ry="33" fill="#3a2b22"></ellipse><circle cx="392" cy="170" r="8" fill="#ffffff"></circle><path class="spark" d="M376 187 Q377 192 382 193 Q377 194 376 199 Q375 194 370 193 Q375 192 376 187 Z" fill="#ffffff"></path></g>
</g>
<g class="{{mouth}}"><path d="M298 262 Q320 268 342 262 Q339 290 320 290 Q301 290 298 262 Z" fill="#8a3b2e"></path><ellipse cx="320" cy="284" rx="12" ry="5" fill="#e8897a"></ellipse></g>
</g></g></g></g>
</svg>
</sc-if>
<sc-if value="{{isSam}}" hint-placeholder-val="{{false}}">
<svg class="facesvg" viewBox="0 0 640 400" role="img" aria-label="Sam, talking">
<defs><radialGradient id="bls"><stop offset="0" stop-color="#f48fa6" stop-opacity="0.75"></stop><stop offset="1" stop-color="#f48fa6" stop-opacity="0"></stop></radialGradient></defs>
<g transform="translate(0 -30)"><g class="sway"><g class="hop"><g class="face">
<g fill="none" stroke="#5a3d28" stroke-width="6.5" stroke-linecap="round"><path d="M226 138 C238 128 266 126 284 132"></path><path d="M414 138 C402 128 374 126 356 132"></path></g>
<ellipse class="cheek" cx="246" cy="236" rx="36" ry="14" fill="url(#bls)"></ellipse><ellipse class="cheek" cx="394" cy="236" rx="36" ry="14" fill="url(#bls)"></ellipse>
<g class="peek">
<g class="eye ss"><rect x="234" y="156" width="44" height="52" rx="17" fill="#3a2b22"></rect><circle cx="264" cy="170" r="7" fill="#ffffff"></circle><path class="spark" d="M248 188 Q249 193 254 194 Q249 195 248 200 Q247 195 242 194 Q247 193 248 188 Z" fill="#ffffff"></path></g>
<g class="eye ss"><rect x="362" y="156" width="44" height="52" rx="17" fill="#3a2b22"></rect><circle cx="392" cy="170" r="7" fill="#ffffff"></circle><path class="spark" d="M376 188 Q377 193 382 194 Q377 195 376 200 Q375 195 370 194 Q375 193 376 188 Z" fill="#ffffff"></path></g>
</g>
<g class="{{mouth}}"><path d="M280 262 Q320 270 360 262 Q354 288 320 288 Q286 288 280 262 Z" fill="#8a3b2e"></path><ellipse cx="320" cy="283" rx="16" ry="4.5" fill="#e8897a"></ellipse></g>
</g></g></g></g>
</svg>

<div class="tag"><b>{{styleName}}</b><span>Plays by itself: 3 styles on Mary, then on Sam. Each word colors in as she says it.</span></div>
<button class="menu-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Menu</button>
<div class="{{capCls}}" aria-hidden="true">
<sc-for list="{{lines}}" as="ln" hint-placeholder-count="2">
<div class="{{ln.cls}}"><sc-for list="{{ln.words}}" as="wd" hint-placeholder-count="5"><span class="{{wd.cls}}" data-t="{{wd.t}}">{{wd.t}}</span></sc-for></div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"range","default":1,"min":0.5,"max":1.5,"step":0.1,"section":"Playback"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.timer = setInterval(() => this.setState({ t: Date.now() - this.t0 }), 40);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  says() {
    if (this.plans) return this.plans;
    const SAYS = [
      { who: 'mary', style: 'A', name: 'A · Coloring-in', text: "Good morning, sunshine! I hope you slept well. Did anyone bring your coffee yet?" },
      { who: 'mary', style: 'B', name: 'B · Bold ink', text: "Dinner came late again? I'm sorry, that sounds hard. Want me to write it down?" },
      { who: 'mary', style: 'C', name: 'C · Speech bubble', text: "Would you like to hear a story? I know a sweet one about a little red barn." },
      { who: 'sam', style: 'A', name: 'A · Coloring-in', text: "Well, good morning! Did you catch the ballgame last night? I heard it went extra innings." },
      { who: 'sam', style: 'B', name: 'B · Bold ink', text: "Your lunch tray never came? That's not right. Let's write it down together." },
      { who: 'sam', style: 'C', name: 'C · Speech bubble', text: "Feel like a game of tic-tac-toe? You go first, and I'll try to keep up." }
    ];
    // Same estimate M4 will use: each word gets a share of the audio by its syllables, plus pauses at punctuation.
    const UNIT = 190;
    this.plans = SAYS.map((s) => {
      let at = 0, line = 0, used = 0;
      const max = s.style === 'C' ? 27 : 30;
      const words = s.text.split(' ').map((t) => {
        const syl = Math.max(1, (t.toLowerCase().match(/[aeiouy]+/g) || []).length);
        const w = { t, start: at, len: (syl + 0.5) * UNIT };
        at += w.len + (/[.?!]$/.test(t) ? 3 * UNIT : /[,;]$/.test(t) ? 1.5 * UNIT : 0);
        const n = used ? used + 1 + t.length : t.length;
        if (used && n > max) { line++; used = t.length; } else used = n;
        w.line = line;
        return w;
      });
      return Object.assign({}, s, { words, end: at });
    });
    return this.plans;
  }
  renderVals() {
    const plans = this.says();
    const HOLD = 1900, GAP = 700, LEAD = 150;
    const speed = this.props.speed ?? 1;
    const total = plans.reduce((a, p) => a + p.end + HOLD + GAP, 0);
    let t = ((((this.state && this.state.t) || 0) * speed) % total);
    let k = 0;
    while (t > plans[k].end + HOLD + GAP) { t -= plans[k].end + HOLD + GAP; k++; }
    const p = plans[k];
    const blank = t > p.end + HOLD;
    let cur = 0;
    p.words.forEach((w) => { if (t >= w.start - LEAD) cur = w.line; });
    const firstOfCur = p.words.find((w) => w.line === cur);
    const lines = [];
    for (let i = Math.max(0, cur - 2); i <= cur; i++) {
      let cls = 'line';
      if (i === cur - 2) {
        if (t - (firstOfCur.start - LEAD) > 600) continue;
        cls = 'line gone';
      }
      lines.push({ cls, words: p.words.filter((w) => w.line === i).map((w) => {
        let c = 'w later';
        if (t >= w.start + w.len) c = 'w done';
        else if (t >= w.start) c = 'w on f' + Math.min(9, Math.max(1, Math.ceil(10 * (t - w.start) / w.len)));
        else if (t >= w.start - LEAD) c = 'w';
        return { t: w.t, cls: c };
      }) });
    }
    return {
      who: p.who,
      isMary: p.who === 'mary',
      isSam: p.who === 'sam',
      styleName: p.name + (p.who === 'sam' ? ' · Sam' : ' · Mary'),
      mouth: t < p.end ? 'mouth-talk' : 'mouth-rest',
      capCls: 'cap cap' + p.style + (p.style === 'C' ? ' bubble' : '') + (blank ? ' hidden' : ''),
      lines
    };
  }
}
</script>
</body>
</html>
