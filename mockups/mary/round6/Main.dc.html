<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"range","default":1,"min":0.5,"max":1.5,"step":0.1,"section":"Playback"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.timer = setInterval(() => this.setState({ t: Date.now() - this.t0 }), 40);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  turns() {
    if (this.plans) return this.plans;
    const TURNS = [
      { who: 'mary', think: 'dots', text: "Good morning, sunshine! I hope you slept well. Did anyone bring your coffee yet?" },
      { who: 'mary', think: 'word', text: "Dinner came late again? I'm sorry, that sounds hard. Want me to write it down?" },
      { who: 'sam', think: 'dots', text: "Well, good morning! Did you catch the ballgame last night? I heard it went extra innings." },
      { who: 'sam', think: 'word', text: "Your lunch tray never came? That's not right. Let's write it down together." }
    ];
    // The estimate M4 will use: each word gets a share of the audio by its syllables, plus pauses at punctuation.
    const UNIT = 190, MAX = 30;
    this.plans = TURNS.map((s) => {
      let at = 0, line = 0, used = 0;
      const words = s.text.split(' ').map((t) => {
        const syl = Math.max(1, (t.toLowerCase().match(/[aeiouy]+/g) || []).length);
        const w = { t, start: at, len: (syl + 0.5) * UNIT };
        at += w.len + (/[.?!]$/.test(t) ? 3 * UNIT : /[,;]$/.test(t) ? 1.5 * UNIT : 0);
        const n = used ? used + 1 + t.length : t.length;
        if (used && n > MAX) { line++; used = t.length; } else used = n;
        w.line = line;
        return w;
      });
      return Object.assign({}, s, { words, end: at });
    });
    return this.plans;
  }
  renderVals() {
    const LISTEN = 3200, THINK = 2200, HOLD = 1800, LEAD = 150;
    const turns = this.turns();
    const span = (p) => LISTEN + THINK + p.end + HOLD;
    const total = turns.reduce((a, p) => a + span(p), 0);
    let t = (((this.state && this.state.t) || 0) * (this.props.speed ?? 1)) % total;
    let k = 0;
    while (t > span(turns[k])) { t -= span(turns[k]); k++; }
    const p = turns[k];
    const name = p.who === 'sam' ? 'Sam' : 'Mary';
    let mood = '', tag = '', talking = false;
    const lines = [];
    if (t < LISTEN) {
      mood = t > 500 && t < LISTEN - 600 ? 'listen loud' : 'listen';
      tag = 'Listening · ' + name;
    } else if (t < LISTEN + THINK) {
      mood = 'think ' + p.think;
      tag = 'Thinking · ' + name + (p.think === 'dots' ? ' · (a) dots' : ' · (b) the word');
    } else {
      const tt = t - LISTEN - THINK;
      talking = tt < p.end;
      tag = 'Talking · ' + name + ' · A · Coloring-in';
      let cur = 0;
      p.words.forEach((w) => { if (tt >= w.start - LEAD) cur = w.line; });
      const firstOfCur = p.words.find((w) => w.line === cur);
      for (let i = Math.max(0, cur - 2); i <= cur; i++) {
        let cls = 'line';
        if (i === cur - 2) {
          if (tt - (firstOfCur.start - LEAD) > 600) continue;
          cls = 'line gone';
        }
        lines.push({ cls, words: p.words.filter((w) => w.line === i).map((w) => {
          let c = 'w later';
          if (tt >= w.start + w.len) c = 'w done';
          else if (tt >= w.start) c = 'w on f' + Math.min(9, Math.max(1, Math.ceil(10 * (tt - w.start) / w.len)));
          else if (tt >= w.start - LEAD) c = 'w';
          return { t: w.t, cls: c };
        }) });
      }
    }
    return {
      who: p.who,
      mood,
      isMary: p.who === 'mary',
      isSam: p.who === 'sam',
      tag,
      mouth: talking ? 'mouth-talk' : 'mouth-rest',
      capCls: 'cap capA' + (lines.length ? '' : ' hidden'),
      lines
    };
  }
}
</script>
