<style>
body{margin:0}
.scr{position:relative;overflow:hidden;box-sizing:border-box;font:22px/1.5 "Segoe UI",system-ui,sans-serif;color:#1f1b16}
.edge{position:absolute;inset:0;pointer-events:none;will-change:opacity;animation:edge 6s ease-in-out infinite}
.edge.fast{animation-duration:3s}
.edge.slow{animation-duration:8s}
.edge.steady{animation:steady 4s ease-in-out infinite}
.facesvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.face{transform-box:view-box;transform-origin:320px 200px;animation:float 6s ease-in-out infinite}
.face.slow{animation-duration:8s}
.face.lean{animation:lean 6s ease-in-out infinite}
.face.tilt{animation:tilt 7s ease-in-out infinite}
.face.bounce{animation:bounce 1.8s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center}
.blink{animation:blink 7s ease-in-out infinite}
.glance{animation:glance 4s ease-in-out infinite}
.cheek{opacity:0}
.blush .cheek{opacity:.85;animation:blush 6s ease-in-out infinite alternate}
.mouth-talk{transform-box:fill-box;transform-origin:50% 0;animation:talk 1.4s ease-in-out infinite}
.dot{opacity:.8;animation:dot 3s ease-in-out infinite}
.dot:nth-of-type(2){animation-delay:.5s}
.dot:nth-of-type(3){animation-delay:1s}
.zz{opacity:.8;animation:zz 6s ease-in-out infinite}
.zz:nth-of-type(2){animation-delay:2s}
.zz:nth-of-type(3){animation-delay:4s}
@keyframes edge{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes steady{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

@keyframes tilt{0%,100%{transform:rotate(3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes glance{0%,100%{transform:translate(0,0)}30%,75%{transform:translate(7px,-7px)}}
@keyframes blush{from{opacity:.35}to{opacity:.95}}
@keyframes talk{0%{transform:scaleY(.4)}20%{transform:scaleY(1)}38%{transform:scaleY(.55)}56%{transform:scaleY(.9)}74%{transform:scaleY(.45)}88%{transform:scaleY(.8)}100%{transform:scaleY(.4)}}
@keyframes dot{0%,15%{opacity:.25}40%,75%{opacity:1}100%{opacity:.25}}

.lift{animation:lift 3s ease-in-out infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 4s ease-in-out infinite alternate}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
.twinkle:nth-of-type(2){animation-delay:1.5s}
.twinkle:nth-of-type(3){animation-delay:.8s}
.soft-blush .cheek{opacity:.45}
.m{opacity:0;animation:seq 16s ease-in-out infinite both}
.m0{opacity:1}
.m1{animation-delay:4s}
.m2{animation-delay:8s}
.m3{animation-delay:12s}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes seq{0%{opacity:0}4%{opacity:1}25%{opacity:1}29%{opacity:0}100%{opacity:0}}
.sway{transform-box:view-box;transform-origin:320px 330px;animation:sway 9s ease-in-out infinite}
.hop{transform-box:view-box;transform-origin:320px 330px;animation:hop 8s ease-in-out infinite}
.ss{animation:ss 6s ease-in-out infinite}
.peek{transform-box:fill-box;transform-origin:center;animation:peek 12s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3.5s ease-in-out infinite}
.cute-blush .cheek{opacity:.8}
.tag{position:absolute;left:24px;top:24px;display:flex;flex-direction:column;gap:2px;padding:10px 24px;background:rgba(255,254,250,.92);border:3px solid #1f1b16;border-radius:24px}
.tag b{font-size:44px;line-height:1.1}
.tag span{font-size:22px;color:#453d34}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}3%{transform:translateY(-10px)}6%{transform:translateY(0) scale(1.02,.98)}9%{transform:translateY(0) scale(1,1)}}
@keyframes ss{0%,88%,100%{transform:scale(1,1)}91%{transform:scale(1.14,.1)}94%{transform:scale(.95,1.07)}97%{transform:scale(1.02,.98)}}
@keyframes peek{0%,55%{transform:translate(-7px,3px)}62%,88%{transform:translate(0,0) scale(1.03)}95%,100%{transform:translate(-7px,3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.dock{position:absolute;left:24px;right:24px;bottom:24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;justify-content:flex-end;align-items:flex-end;gap:16px}
.talk{display:flex;align-items:center;justify-content:center;gap:18px;width:340px;min-height:104px;font:inherit;font-size:36px;font-weight:700;background:#1f1b16;color:#fff;border:0;border-radius:24px;box-shadow:0 7px 0 rgba(0,0,0,.28);cursor:pointer}
.talk svg{width:52px;height:52px}
.caption{background:rgba(31,27,22,.9);color:#fff;font-size:36px;font-weight:600;line-height:1.3;padding:18px 28px;border-radius:20px}
.urgent .caption{background:#7a1212}
</style>
